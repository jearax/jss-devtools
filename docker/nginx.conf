server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	server_tokens off;

	# The installer is fetched by every install, so it must never be cached.
	location = /install.sh {
		types { }
		default_type text/plain;
		charset utf-8;
		add_header Cache-Control "no-cache" always;
	}

	# Crawlers ask for this before anything else, so it is a real file and not the 404 page.
	location = /robots.txt {
		try_files /robots.txt =404;
	}

	# The bundle and its checksum change with every deploy, so they must never be cached either.
	# try_files keeps the directory itself at 404 instead of nginx's 403 for a missing index.
	location /releases/latest/ {
		try_files $uri =404;
		add_header Cache-Control "no-cache" always;
	}

	# try_files serves the file in this exact location, so /index.html itself stays 404.
	location = / {
		try_files /index.html =404;
	}

	# The Docs area is a single page application: its paths are answered with the shell, so a docs
	# page survives a reload. The trailing slash keeps /docs-anything out of this block.
	location = /docs {
		try_files /index.html =404;
	}

	location ^~ /docs/ {
		try_files /index.html =404;
	}

	# The asset names carry a content hash, so they can be cached forever.
	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	location / {
		return 404;
	}
}
