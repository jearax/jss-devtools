name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      node: ${{ steps.floor.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The only Node CI runs is the exact floor in engines.node, so one run proves both the toolchain
      # and the shipped bundle on the oldest version anyone may use.
      - id: floor
        run: echo "node=$(node -p "require('./package.json').engines.node.replace(/^>=/, '')")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ steps.floor.outputs.node }}
          require-lockfile: true
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      # The site is its own project with its own lint and test stack, so its own dependencies must be present.
      - run: pnpm --dir site install --frozen-lockfile

      # The site's tests run in a real Chromium through Vitest Browser Mode.
      - name: Install Chromium for the site's browser tests
        run: pnpm --dir site exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir site lint
      - run: pnpm --dir site typecheck
      - run: pnpm --dir site test
      - run: pnpm test
      - run: pnpm build

      # The installer is fetched over HTTP and piped into a shell, so it is checked as POSIX sh.
      - name: Shellcheck the installer
        run: |
          docker run --rm -v "$PWD:/mnt:ro" \
            koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 \
            shellcheck --shell=sh /mnt/scripts/install.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-bundle
          path: dist/cli.mjs
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build and smoke the site image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.checks.outputs.node }}

      # The image serves the built site, so it is built here, on the same Node floor as the CLI.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ needs.checks.outputs.node }}

      - name: Build the site
        run: |
          pnpm --dir site install --frozen-lockfile
          pnpm --dir site build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-bundle
          path: bundle

      - name: Stage the release
        run: node scripts/stage-release.mjs bundle/cli.mjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image is loaded, not pushed, so the smoke test runs against the exact bytes that ship.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: jss-devtools-site:ci
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      - name: Smoke the image
        run: ci/smoke-site-image.sh jss-devtools-site:ci "$(node -p "require('./package.json').version")"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag jss-devtools-site:ci ghcr.io/${{ github.repository }}:latest
          docker tag jss-devtools-site:ci ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  # Dokploy deploys only a GitHub push event for the service's branch; anything else gets 301
  # "Branch Not Match". A push to main is therefore a deploy, and the checks gate it.
  deploy:
    name: Deploy to Dokploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    steps:
      - name: Trigger the Dokploy redeploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          PUSH_EVENT: ${{ toJSON(github.event) }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is not set on the 'main' environment"
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data "$PUSH_EVENT")
          echo "Dokploy answered HTTP $status: $(cat response.json)"
          if [ "$status" != "200" ]; then
            echo "::error::Dokploy did not deploy"
            exit 1
          fi
